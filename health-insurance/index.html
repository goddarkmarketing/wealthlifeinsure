<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="0; url=../health-insurance.html">
  <link rel="canonical" href="../health-insurance.html">
  <script>
    window.location.replace("../health-insurance.html");
  </script>












<style id="wli-theme-vars">:root{--brand-name-scale:0.9;}</style>
</head>
<body>
  <p>กำลังพาไปหน้าประกันสุขภาพ... <a href="../health-insurance.html">คลิกที่นี่</a></p>







<!-- wli-tracking-body-end -->
<script>
(() => {
  if (!location.pathname.startsWith('/careers/career/')) return;
  const fixLinks = () => {
    document.querySelectorAll('.article-related-careers a[href^="../careers/"]').forEach((link) => {
      link.setAttribute('href', link.getAttribute('href').replace('../careers/', '../'));
    });
    document.querySelectorAll('.article-related-careers a[href="../careers.html"]').forEach((link) => {
      link.setAttribute('href', '../../careers.html');
    });
  };
  fixLinks();
  const observer = new MutationObserver(fixLinks);
  observer.observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('load', () => {
    setTimeout(() => {
      fixLinks();
      observer.disconnect();
    }, 3000);
  }, { once: true });
})();
</script>
<!-- /wli-tracking-body-end -->
</body>
</html>
