# คัดลอกเป็น config.yml แล้วแก้ค่าตาม tunnel ของคุณ
# ดูขั้นตอนใน README.md

tunnel: YOUR_TUNNEL_UUID_HERE
credentials-file: C:\Users\YOUR_USER\.cloudflared\YOUR_TUNNEL_UUID_HERE.json

ingress:
  # โดเมนที่ลูกค้าเปิดดู (ต้องผูก DNS ด้วย cloudflared tunnel route dns)
  - hostname: preview.yourdomain.com
    service: http://127.0.0.1:80
    originRequest:
      httpHostHeader: localhost
  # ถ้าเปิดแล้วเจอหน้า XAMPP แทนเว็บ ให้ลูกค้าใช้ path:
  # https://preview.yourdomain.com/wealthlifeinsure.com/
  - service: http_status:404
